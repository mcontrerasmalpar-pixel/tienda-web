<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hebillas Gin&Jes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="toast" class="toast" role="status"></div>

  <section id="auth-view" class="auth-shell">
    <div class="auth-card">
      <a class="brand" href="../index.html"><span>HEBILLAS</span><strong>GIN<em>&amp;</em>JES</strong></a>
      <p class="eyebrow">Área privada</p>
      <h1>Administrar catálogo</h1>
      <p class="muted">Inicia sesión para gestionar productos e imágenes.</p>
      <form id="login-form">
        <label>Correo electrónico<input id="login-email" type="email" autocomplete="email" required /></label>
        <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">Iniciar sesión</button>
        <p id="login-error" class="error" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section id="dashboard-view" class="dashboard hidden">
    <header class="topbar">
      <a class="brand" href="../index.html"><span>HEBILLAS</span><strong>GIN<em>&amp;</em>JES</strong></a>
      <div class="top-actions"><span id="admin-email" class="muted"></span><button id="logout-btn" class="ghost">Cerrar sesión</button></div>
    </header>
    <main class="content">
      <div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1>Productos</h1><p class="muted">Agrega, edita y organiza el inventario visible en la tienda.</p></div><button id="new-product-btn" class="primary">+ Nuevo producto</button></div>
      <div class="stats-row"><div><span>Total productos</span><strong id="total-products">0</strong></div><div><span>Destacados</span><strong id="featured-products">0</strong></div><div><span>Categorías</span><strong id="category-total">0</strong></div></div>
      <div class="toolbar"><input id="product-search" type="search" placeholder="Buscar por nombre o código..." /><select id="category-filter"><option value="">Todas las categorías</option></select></div>
      <div id="products-list" class="products-list"><div class="loading">Cargando catálogo…</div></div>
    </main>
  </section>

  <dialog id="product-dialog">
    <form id="product-form" method="dialog" class="product-form">
      <div class="dialog-heading"><div><p class="eyebrow">Catálogo</p><h2 id="dialog-title">Nuevo producto</h2></div><button type="button" class="close" id="close-dialog" aria-label="Cerrar">×</button></div>
      <input id="product-id" type="hidden" />
      <div class="form-grid">
        <label>Nombre *<input id="product-name" required /></label>
        <label>Código<input id="product-code" /></label>
        <label>Categoría *<input id="product-category" list="category-options" required /><datalist id="category-options"></datalist></label>
        <label>Precio (S/)<input id="product-price" type="number" min="0" step="0.01" placeholder="Opcional" /></label>
      </div>
      <label>Descripción<textarea id="product-description" rows="4" placeholder="Describe el producto..."></textarea></label>
      <label class="check"><input id="product-featured" type="checkbox" /> Marcar como destacado</label>
      <label class="upload">Imagen del producto<input id="product-image" type="file" accept="image/jpeg,image/png,image/webp" /><span id="file-name">JPG, PNG o WEBP · máximo 5 MB</span></label>
      <div id="image-preview" class="image-preview hidden"><img id="preview-img" alt="Vista previa" /></div>
      <p id="form-error" class="error" aria-live="polite"></p>
      <div class="form-actions"><button type="button" id="cancel-dialog" class="ghost">Cancelar</button><button type="submit" class="primary">Guardar producto</button></div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
